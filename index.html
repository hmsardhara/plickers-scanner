<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>મોબાઈલ સ્કેનર - સ્માર્ટ ક્લાસરૂમ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-aruco@0.1.0/src/cv.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-aruco@0.1.0/src/aruco.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col font-sans">

  <!-- લોગિન સ્ક્રીન -->
  <div id="loginScreen" class="fixed inset-0 bg-slate-900 z-50 flex items-center justify-center p-5">
    <div class="bg-slate-800 max-w-sm w-full rounded-2xl p-6 shadow-2xl border border-slate-700 space-y-4 text-center">
      <h1 class="text-2xl font-bold text-indigo-400">📱 શિક્ષક સ્કેનર લોગિન</h1>
      <p class="text-xs text-slate-400">માસ્ટર શીટ મુજબ UserCode અને Password નાખો</p>
      <input id="uCode" type="text" placeholder="UserCode (દા.ત. SCH01)" class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-600 text-white uppercase font-bold">
      <input id="uPass" type="password" placeholder="Password" class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-600 text-white">
      <button id="loginBtn" onclick="doLogin()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 rounded-xl font-bold text-lg">લોગિન કરો</button>
      <p id="loginErr" class="text-sm text-rose-400 font-semibold"></p>
    </div>
  </div>

  <!-- મુખ્ય એપ (લોગિન પછી) -->
  <div id="mainApp" class="hidden flex-1 flex flex-col">
    <!-- ટોપ બાર -->
    <div class="p-2 bg-slate-800 flex items-center justify-between gap-2 shadow border-b border-slate-700">
      <div class="truncate">
        <div id="schoolNameDisp" class="text-xs font-bold text-amber-400 truncate"></div>
        <div id="statusText" class="text-[11px] text-emerald-400">તૈયાર છે ✓</div>
      </div>
      <div class="flex gap-1.5">
        <button onclick="saveChapterScores()" class="text-xs bg-emerald-600 text-white font-bold px-2.5 py-1.5 rounded-lg">💾 સ્કોર સેવ</button>
        <button onclick="logout()" class="text-xs bg-slate-700 text-slate-300 px-2 py-1.5 rounded-lg">🚪</button>
      </div>
    </div>

    <!-- ધોરણ અને પ્રકરણ સિલેક્શન -->
    <div class="p-2 bg-slate-800/90 grid grid-cols-2 gap-2 border-b border-slate-700">
      <select id="stdSelect" onchange="onStdChange()" class="bg-amber-500 text-black font-bold text-xs px-2 py-2 rounded-lg"></select>
      <select id="chSelect" onchange="onChapterChange()" class="bg-slate-700 text-white font-bold text-xs px-2 py-2 rounded-lg"></select>
    </div>

    <!-- પ્રશ્ન અને કંટ્રોલ -->
    <div class="p-2 bg-slate-800/70 border-b border-slate-700 space-y-2">
      <div class="flex items-center justify-between gap-2">
        <button onclick="changeQ(-1)" class="px-3 py-1 bg-slate-700 rounded font-bold">◀</button>
        <div id="qTitle" class="text-xs font-semibold text-center flex-1 truncate">પ્રશ્ન લોડ થાય છે...</div>
        <button onclick="changeQ(1)" class="px-3 py-1 bg-slate-700 rounded font-bold">▶</button>
      </div>
      <div class="grid grid-cols-3 gap-1.5">
        <button id="toggleAnsBtn" onclick="toggleShowAnswer()" class="py-1.5 bg-indigo-600 rounded-lg text-xs font-bold">👁️ જવાબ</button>
        <button id="toggleLbBtn" onclick="toggleLeaderboard()" class="py-1.5 bg-amber-600 rounded-lg text-xs font-bold">🏆 લીડરબોર્ડ</button>
        <button onclick="clearCurrentAnswers()" class="py-1.5 bg-rose-600 rounded-lg text-xs font-bold">🗑️ ક્લિયર</button>
      </div>
    </div>

    <!-- કેમેરા વ્યૂ -->
    <div class="relative flex-1 bg-black flex items-center justify-center overflow-hidden">
      <video id="video" autoplay playsinline class="w-full h-full object-cover"></video>
      <canvas id="overlay" class="absolute inset-0 w-full h-full pointer-events-none"></canvas>
      <canvas id="processCanvas" class="hidden"></canvas>
      <button id="startCamBtn" onclick="startCamera()" class="absolute px-6 py-3 bg-emerald-600 rounded-xl font-bold shadow-lg text-lg">📷 કેમેરા ચાલુ કરો</button>
    </div>

    <!-- સ્કેન લિસ્ટ -->
    <div class="p-2 bg-slate-800 max-h-24 overflow-y-auto">
      <div class="text-[11px] text-slate-400 mb-1">સ્કેન થયેલા (<span id="scanCount">0</span>):</div>
      <div id="scannedList" class="flex flex-wrap gap-1"></div>
    </div>
  </div>

  <script>
    // 👇 અહીં તમારી Google Apps Script ની /exec લિંક પેસ્ટ કરો
    const GAS_URL = "https://script.google.com/macros/s/AKfycbx-Qhvx3gsRG_obUdLimG3wEgZPOuYjWhKKslV1TetbhSmel1RWvv1M5OKL4CtOSdsy0A/exec";

    let session = null; // { userCode, schoolName, standards }
    let chapters = [], questions = [];
    let currentStd = '', currentFileId = '', currentCh = '', currentChTitle = '';
    let activeQIndex = 0, showAnswer = false, showLeaderboard = false;
    let scannedResponses = {}, pendingSync = {}, isSyncing = false;

    let detector = new AR.Detector();
    let video = document.getElementById('video');
    let overlay = document.getElementById('overlay');
    let pCanvas = document.getElementById('processCanvas');
    let oCtx = overlay.getContext('2d'), pCtx = pCanvas.getContext('2d');
    let scanning = false, audioCtx = null;

    function playBeepAndVibrate() {
      if (navigator.vibrate) navigator.vibrate(80);
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.12);
      } catch (e) {}
    }

    async function postToGAS(payload) {
      const res = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      return await res.json();
    }

    async function doLogin() {
      const userCode = document.getElementById('uCode').value.trim();
      const password = document.getElementById('uPass').value.trim();
      document.getElementById('loginBtn').innerText = 'ચેક થાય છે...';
      document.getElementById('loginErr').innerText = '';
      try {
        const res = await fetch(`${GAS_URL}?action=login&userCode=${encodeURIComponent(userCode)}&password=${encodeURIComponent(password)}`);
        const data = await res.json();
        document.getElementById('loginBtn').innerText = 'લોગિન કરો';
        if (!data.success) {
          document.getElementById('loginErr').innerText = data.message;
          return;
        }
        session = data;
        document.getElementById('schoolNameDisp').innerText = `${data.schoolName} (વેલિડ: ${data.validUntil || '∞'})`;
        document.getElementById('stdSelect').innerHTML = data.standards.map(s =>
          `<option value="${s.fileId}" data-std="${s.std}">ધોરણ ${s.std}</option>`
        ).join('');
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('mainApp').classList.remove('hidden');
        onStdChange();
      } catch (e) {
        document.getElementById('loginBtn').innerText = 'લોગિન કરો';
        document.getElementById('loginErr').innerText = 'સર્વર કનેક્શન એરર! GAS_URL ચેક કરો.';
      }
    }

    function logout() { location.reload(); }

    async function onStdChange() {
      const sel = document.getElementById('stdSelect');
      currentFileId = sel.value;
      currentStd = sel.options[sel.selectedIndex].dataset.std;
      document.getElementById('statusText').innerText = 'પ્રકરણ લોડ થાય છે...';
      const res = await fetch(`${GAS_URL}?action=getChapters&fileId=${encodeURIComponent(currentFileId)}`);
      const data = await res.json();
      chapters = data.chapters || [];
      document.getElementById('chSelect').innerHTML = chapters.map(c =>
        `<option value="${c.sheetName}">${c.chNo}. ${c.chName}</option>`
      ).join('');
      if (chapters.length > 0) onChapterChange();
    }

    async function onChapterChange() {
      const sel = document.getElementById('chSelect');
      currentCh = sel.value;
      currentChTitle = sel.options[sel.selectedIndex].text;
      document.getElementById('statusText').innerText = 'પ્રશ્નો લોડ થાય છે...';
      const res = await fetch(`${GAS_URL}?action=getChapterData&fileId=${encodeURIComponent(currentFileId)}&ch=${encodeURIComponent(currentCh)}`);
      const data = await res.json();
      questions = data.questions || [];
      activeQIndex = 0; showAnswer = false; showLeaderboard = false;
      scannedResponses = {}; pendingSync = {};
      updateUI();
      await postToGAS({
        action: 'setQuizControl', userCode: session.userCode, schoolName: session.schoolName,
        fileId: currentFileId, selectedStd: currentStd, selectedChapter: currentCh,
        chapterTitle: currentChTitle, resetSession: true
      });
      document.getElementById('statusText').innerText = 'બોર્ડ અપડેટ થયું ✓';
    }

    function updateUI() {
      if (questions.length > 0) {
        const q = questions[activeQIndex] || questions[0];
        document.getElementById('qTitle').innerText = `પ્ર.${q.qNo}: ${q.question}`;
      } else {
        document.getElementById('qTitle').innerText = 'આ પ્રકરણમાં પ્રશ્ન નથી';
      }
      const aBtn = document.getElementById('toggleAnsBtn');
      aBtn.innerText = showAnswer ? '🙈 છુપાવો' : '👁️ જવાબ';
      aBtn.className = showAnswer ? 'py-1.5 bg-emerald-600 rounded-lg text-xs font-bold' : 'py-1.5 bg-indigo-600 rounded-lg text-xs font-bold';

      const lBtn = document.getElementById('toggleLbBtn');
      lBtn.innerText = showLeaderboard ? '📋 પ્રશ્ન' : '🏆 લીડરબોર્ડ';
      lBtn.className = showLeaderboard ? 'py-1.5 bg-purple-600 rounded-lg text-xs font-bold' : 'py-1.5 bg-amber-600 rounded-lg text-xs font-bold';

      renderScannedList();
    }

    function renderScannedList() {
      const keys = Object.keys(scannedResponses);
      document.getElementById('scanCount').innerText = keys.length;
      document.getElementById('scannedList').innerHTML = keys.map(roll =>
        `<span class="px-2 py-0.5 bg-emerald-700 text-xs rounded font-bold">#${roll}: ${scannedResponses[roll]}</span>`
      ).join('');
    }

    async function changeQ(dir) {
      if (questions.length === 0) return;
      activeQIndex = (activeQIndex + dir + questions.length) % questions.length;
      showAnswer = false; showLeaderboard = false; pendingSync = {};
      const res = await postToGAS({
        action: 'setQuizControl', userCode: session.userCode, activeQIndex,
        showAnswer: false, showLeaderboard: false, clearResponses: false
      });
      scannedResponses = (res.data && res.data.responses) ? res.data.responses : {};
      updateUI();
    }

    async function toggleShowAnswer() {
      showAnswer = !showAnswer; showLeaderboard = false; updateUI();
      await postToGAS({ action: 'setQuizControl', userCode: session.userCode, activeQIndex, showAnswer, showLeaderboard: false });
    }

    async function toggleLeaderboard() {
      showLeaderboard = !showLeaderboard; updateUI();
      await postToGAS({ action: 'setQuizControl', userCode: session.userCode, activeQIndex, showAnswer, showLeaderboard });
    }

    async function clearCurrentAnswers() {
      if (!confirm('ચાલુ પ્રશ્નના જવાબો ભૂંસી નાખવા છે?')) return;
      scannedResponses = {}; pendingSync = {}; updateUI();
      await postToGAS({ action: 'setQuizControl', userCode: session.userCode, activeQIndex, showAnswer, showLeaderboard, clearResponses: true });
    }

    async function saveChapterScores() {
      document.getElementById('statusText').innerText = 'સ્કોર સેવ થાય છે...';
      const res = await postToGAS({ action: 'saveChapterScores', userCode: session.userCode });
      alert(res.data ? res.data.message : 'સેવ થઈ ગયું!');
      document.getElementById('statusText').innerText = 'સ્કોર સેવ થઈ ગયા ✓';
    }

    async function startCamera() {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        video.srcObject = stream;
        document.getElementById('startCamBtn').style.display = 'none';
        scanning = true;
        requestAnimationFrame(tick);
      } catch (err) {
        alert('કેમેરા ચાલુ થઈ શક્યો નથી: ' + err.message);
      }
    }

    function getAnswerFromCorners(corners) {
      const dx = corners[1].x - corners[0].x, dy = corners[1].y - corners[0].y;
      const angle = Math.atan2(dy, dx) * 180 / Math.PI;
      if (angle >= -45 && angle < 45) return 'A';
      if (angle >= -135 && angle < -45) return 'B';
      if (angle >= 45 && angle < 135) return 'D';
      return 'C';
    }

    function tick() {
      if (!scanning) return;
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        const scale = 640 / video.videoWidth;
        const w = 640, h = Math.round(video.videoHeight * scale);
        pCanvas.width = w; pCanvas.height = h; overlay.width = w; overlay.height = h;
        pCtx.drawImage(video, 0, 0, w, h);
        const markers = detector.detect(pCtx.getImageData(0, 0, w, h));

        oCtx.clearRect(0, 0, w, h);
        markers.forEach(m => {
          if (m.id < 1 || m.id > 200) return;
          const ans = getAnswerFromCorners(m.corners);
          oCtx.strokeStyle = '#10b981'; oCtx.lineWidth = 4;
          oCtx.beginPath();
          m.corners.forEach((c, i) => i === 0 ? oCtx.moveTo(c.x, c.y) : oCtx.lineTo(c.x, c.y));
          oCtx.closePath(); oCtx.stroke();

          oCtx.fillStyle = '#10b981'; oCtx.fillRect(m.corners[0].x, m.corners[0].y - 26, 75, 24);
          oCtx.fillStyle = '#fff'; oCtx.font = 'bold 16px sans-serif';
          oCtx.fillText(`#${m.id}: ${ans}`, m.corners[0].x + 5, m.corners[0].y - 8);

          if (scannedResponses[m.id] !== ans) {
            scannedResponses[m.id] = ans;
            pendingSync[m.id] = ans;
            playBeepAndVibrate();
            renderScannedList();
          }
        });
      }
      requestAnimationFrame(tick);
    }

    setInterval(async () => {
      if (isSyncing || !session || Object.keys(pendingSync).length === 0) return;
      isSyncing = true;
      const batch = { ...pendingSync };
      pendingSync = {};
      document.getElementById('statusText').innerText = 'સિંક થાય છે...';
      try {
        await postToGAS({ action: 'updateResponses', userCode: session.userCode, responses: batch });
        document.getElementById('statusText').innerText = 'લાઇવ સિંક ✓';
      } catch (e) {
        document.getElementById('statusText').innerText = 'સિંક ફેલ!';
      }
      isSyncing = false;
    }, 1500);
  </script>
</body>
</html>
